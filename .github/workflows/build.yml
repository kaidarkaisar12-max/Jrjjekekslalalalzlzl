name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
      - name: Unpack
        run: |
          unzip -q "$(ls *.zip | head -n 1)" -d proj
          find proj -maxdepth 3 | head -40
      - name: Build
        run: |
          D="$(dirname "$(find proj -name gradlew | head -n 1)")"
          echo "Project dir: $D"
          cd "$D"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: SmartHumans-jar
          path: out/*.jar
